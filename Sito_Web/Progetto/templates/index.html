<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Burnout Prediction</title>
</head>
<body>
    <h1>Predizione Burnout Sviluppatore</h1>

    <form method="GET" action="{{ url_for('predict') }}">
        <p>Ore lavoro giornaliere: <input name="daily_work_hours" required></p>
        <p>Ore di sonno: <input name="sleep_hours" required></p>
        <p>Caffeina al giorno: <input name="caffeine_intake" required></p>
        <p>Bug al giorno: <input name="bugs_per_day" required></p>
        <p>Meeting al giorno: <input name="meetings_per_day" required></p>
        <p>Ore esercizio: <input name="exercise_hours" required></p>

        <p><button type="submit">Predici</button></p>
    </form>
</body>
</html>
